name: Update Twitch Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: 

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Twitch Live Status
        env:
          CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          BROADCASTER: "frognbear" # Change to your twitch channel username
        run: |
          # 1. Fetch App Access Token
          TOKEN_RESP=$(curl -s -X POST "https://api.twitch.tv/helix/streams" \
            -d "client_id=${CLIENT_ID}&client_secret=${CLIENT_SECRET}&grant_type=client_credentials")
          
          ACCESS_TOKEN=$(echo "$TOKEN_RESP" | jq -r '.access_token')

          # 2. Query Live Stream Endpoint (Fixed URL layout structure)
          STREAM_RESP=$(curl -s -H "Client-ID: ${CLIENT_ID}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://twitch.tv{BROADCASTER}")

          # 3. Use jq to parse the array objects
          IS_LIVE=$(echo "$STREAM_RESP" | jq '.data | length > 0')

          if [ "$IS_LIVE" = "true" ]; then
            STARTED_AT=$(echo "$STREAM_RESP" | jq -r '.data[0].started_at')
            echo "{\"is_live\": true, \"started_at\": \"$STARTED_AT\"}" > stream.json
          else
            echo "{\"is_live\": false, \"started_at\": null}" > stream.json
          fi

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stream.json
          git diff-index --quiet HEAD || (git commit -m "Update live stream timeline data" && git push)
