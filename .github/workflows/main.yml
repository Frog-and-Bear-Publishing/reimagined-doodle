name: Generate XML Sitemap

on:
  push:
    branches:
      - main  # Change this to 'master' if your default branch is master

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
    # 1. This checks out your code so the action can scan your HTML files
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Needed so it can read commit history for accurate page update times

    # 2. This is the building block you found, filled out with your settings
    - name: Generate Sitemap
      id: sitemap
      uses: cicirello/generate-sitemap@v1.10.4
      with:
        path-to-root: .
        base-url-path: https://frognbearpub.com # <-- REPLACE THIS WITH YOUR ACTUAL SITE URL
        include-html: true
        include-pdf: false # Set to true if you want PDFs in your sitemap
        sitemap-format: xml

    # 3. This saves and pushes the new sitemap.xml file back into your repository
    - name: Commit and Push Sitemap
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add sitemap.xml
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated sitemap update" && git push)
